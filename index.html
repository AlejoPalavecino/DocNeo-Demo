.cv-metric span,.cv-reply-copy>small{font-size:11px;color:var(--muted);display:block}
.cv-reply-copy>small{margin-top:4px;line-height:1.6}
.cv-answer-rows{margin:8px 0;display:grid;gap:0;border:1px solid var(--line);border-radius:9px;padding:3px 10px}
.cv-answer-rows>div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.cv-answer-rows>div:last-child{border-bottom:0}
.cv-answer-rows dt{color:var(--muted)}
.cv-answer-rows dd{font-weight:650;margin:0;text-align:right}
.cv-source{display:flex;align-items:center;gap:5px;margin-top:9px;color:#4b736d;font-size:10px}
.cv-recorder{background:#153f43;color:#fff;border-radius:16px;overflow:hidden;padding:20px 22px;position:relative}
.cv-rec-head,.cv-rec-actions{display:flex;align-items:center;gap:10px;position:relative;flex-wrap:wrap}
.cv-rec-head{justify-content:space-between}
.cv-voice-label,.cv-rec-status,.cv-rec-btn,.cv-rec-alt{display:inline-flex;align-items:center;gap:7px}
.cv-voice-label{color:#c1e6dd;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.08em}
.cv-rec-status{font-size:10px;color:#d2e9e1;padding:5px 8px;border:1px solid #4a6e6d;border-radius:20px}
.cv-rec-status:before{content:"";background:#87ceab}
.cv-rec-body{display:flex;align-items:center;gap:20px;min-height:112px;padding:14px 0}
.cv-mic-orb{width:59px;height:59px;flex:none;display:grid;place-items:center;border-radius:50%;color:#e1fbf2;border:1px solid #56817b;background:#295751;box-shadow:0 0 0 6px #2b514f}
.cv-wave{height:72px;display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 94%,transparent)}
.cv-wave i{flex:1 1 4px;max-width:5px;min-width:2px;height:var(--h);border-radius:3px;background:#91d0b9}
.cv-recorder.is-active .cv-wave i{animation:cvWave 700ms var(--d) ease-in-out infinite alternate}
@keyframes cvWave{from{transform:scaleY(.45)}to{transform:scaleY(1.1)}}
.cv-rec-btn,.cv-rec-alt{min-height:38px;border-radius:8px;padding:8px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.cv-rec-btn{background:#ecfaf2;color:#1b5148;border:1px solid #ecfaf2}
.cv-rec-alt{border:1px solid #628581;color:#f5fbf8;background:transparent}
.cv-rec-btn:hover{background:#cdebdc}.cv-rec-alt:hover{background:#2c5757}
.cv-transcript{padding:19px 20px}
.cv-transcript header{display:flex;align-items:center;gap:10px}
.cv-transcript header>div>h2{font-size:20px}
.cv-editflag{display:inline-flex;margin-left:auto;background:#f0f4f1;color:#527069;padding:5px 9px}
.cv-transcript textarea{margin-top:14px;width:100%;min-height:126px;resize:vertical;font:inherit;font-size:14px;line-height:1.7;letter-spacing:0;color:var(--ink);background:#fbfdfc;padding:12px 13px;border:1px solid #cbdad6;border-radius:10px}
.cv-transcript textarea:focus{outline:2px solid #72aca6;outline-offset:1px}
.cv-fieldfoot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10.5px;line-height:1.5;margin:7px 0 16px}
.cv-fieldfoot>span:last-child{flex:none}
.cv-reviewbtn{display:inline-flex;gap:8px;align-items:center}
.cv-reviewbtn:disabled{opacity:.5;cursor:not-allowed}
.cv-guide ul{list-style:none;margin:12px 0;padding:0}
.cv-guide li{position:relative;padding:6px 0 6px 15px;color:var(--ink);font-size:12px;line-height:1.5}
.cv-guide li:before{content:"";width:4px;height:4px;background:#6b9b87;position:absolute;left:1px;top:13px;border-radius:50%}
.cv-guide-note{display:flex;align-items:flex-start;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.cv-guide-note>svg{flex:none;margin-top:2px;color:#48776d}
.cv-guide-note p,.cv-browser-note{font-size:11px}
.cv-voicelayout>aside{display:grid;gap:14px}
.cv-mic-info{background:#fff7e8;border:1px solid #e9d5aa;border-radius:12px;padding:15px;font-size:13px}
.cv-mic-info p{font-size:12px;line-height:1.6;margin:5px 0 10px}
.cv-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cv-page button:focus-visible,.cv-page input:focus-visible{outline:2px solid #439a92;outline-offset:3px}
@media(max-width:1100px){.cv-chatlayout,.cv-voicelayout{grid-template-columns:minmax(0,1fr) minmax(204px,.42fr);gap:12px}.cv-asidecard{padding:16px}.cv-shortcut{font-size:11px;gap:5px}}
@media(max-width:930px){.cv-chatlayout,.cv-voicelayout{grid-template-columns:minmax(0,1fr)}.cv-chat-side,.cv-voicelayout>aside{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.cv-talk{height:420px}.cv-pagehead{align-items:flex-start}.cv-chat-side .cv-quicklist{grid-template-columns:1fr}}
@media(max-width:550px){.cv-pagehead .cv-status{align-self:flex-start}.cv-pagehead{flex-direction:column;gap:8px;margin-bottom:15px}.cv-talk{height:395px;padding:13px}.cv-chat-side,.cv-voicelayout>aside{grid-template-columns:minmax(0,1fr)}.cv-chatbar{padding:12px 14px}.cv-chatcaption{font-size:9px}.cv-recorder{padding:16px}.cv-rec-body{min-height:98px}.cv-rec-status{font-size:9px}.cv-shortcut{font-size:11px;min-height:42px}.cv-compose{margin:0 10px}.cv-transcript{padding:15px}.cv-quickgrid .cv-shortcut>svg:last-child{display:none}.cv-wave{gap:3px}.cv-quickgrid{grid-template-columns:1fr 1fr}.cv-chat-side .cv-quicklist{grid-template-columns:repeat(2,1fr)}}
@media(max-width:360px){.cv-quickgrid{grid-template-columns:1fr}.cv-talk{height:445px}.cv-wave{gap:2px}.cv-rec-actions{gap:6px}.cv-rec-btn,.cv-rec-alt{font-size:11px}}
@media(prefers-reduced-motion:reduce){.cv-recorder.is-active .cv-wave i{animation:none}.cv-shortcut{transition:none}}

<script>
'use strict';
const CUT='2026-11-09', SECTORS=['Internación conjunta','Cuidados intermedios','Terapia intensiva'];
const PROFILES=[
 {id:'elena',name:'Dra. Elena Torres',short:'Dra. Torres',role:'Médica neonatóloga',initials:'ET',color:'#d5ebe5',ink:'#255e54',canWrite:true},

];
const APP_KEY='docneo.neonatologia.demo.v1';
const routeNames={home:'Inicio',records:'Registros neonatales',stats:'Estadísticas',document:'Cargar documentación',voice:'Carga por voz',chat:'Consultas con Neo',pending:'Revisiones pendientes',review:'Revisión de datos'};
let state,route='home',shellToastTimer,storageOK=true;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(s){const d=String(s||'').slice(0,10).split('-');return d.length===3?`${d[2]}/${d[1]}/${d[0]}`:'Sin informar'}
function days(a,b){return Math.round((Date.parse(String(b).slice(0,10)+'T00:00:00Z')-Date.parse(String(a).slice(0,10)+'T00:00:00Z'))/86400000)}
function profile(){return PROFILES.find(p=>p.id===state.profileId)||PROFILES[0]}
function seedState(){
 const base=[
 ['041','10-02','F','38+2',3180,'10-05',0,0],['042','10-05','M','35+6',2410,'10-13',1,1],['043','10-11','F','39+1',3420,'10-12',0,0],['044','10-17','M','34+4',2180,'10-29',2,2],
 ['045','10-21','F','37+0',2890,'',2,1],['046','10-28','M','40+0',3560,'10-30',0,0],['047','11-02','F','36+5',2520,'',1,2],['048','11-07','M','38+0',3210,'',0,0]
 ];
 const records=base.map(([n,date,sex,gest,weight,out,sector,who],i)=>({id:`RN-2026-${n}`,birth:'2026-'+date,admit:'2026-'+date,sex,gest,weight,discharge:out?'2026-'+out:'',sector:SECTORS[sector],vax:i===3||i===6?'Sin informar':'Informado',source:'Libro de ingresos · Octubre y noviembre',sourceKind:'Documento',author:PROFILES[who].name,reviewer:PROFILES[(who+1)%3].name,updated:'2026-'+(out||date),history:[]}));
 return {version:1,profileId:'elena',records,drafts:seedDrafts(),activeDraft:null}
}
function loadState(){let data=null;try{data=JSON.parse(localStorage.getItem(APP_KEY)||'null')}catch{storageOK=false}
 return data?.version===1&&Array.isArray(data.records)&&Array.isArray(data.drafts)&&PROFILES.some(p=>p.id===data.profileId)?data:seedState()}
function persist(){try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch{if(storageOK){storageOK=false;toast('Los cambios se conservan mientras esta pestaña esté abierta.')}}}
function nextId(){const ids=new Set([...state.records,...state.drafts.flatMap(d=>d.rows||[])].map(r=>r.id));let n=101;while(ids.has(`RN-2026-${String(n).padStart(3,'0')}`))n++;return `RN-2026-${String(n).padStart(3,'0')}`}
const glyphs={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>',
 records:'<rect x="4" y="5" width="16" height="16" rx="2"/><rect x="8" y="3" width="8" height="4" rx="1.3"/><path d="M8 11h8M8 15h6"/>',
 chart:'<path d="M3 3v18h18M7 16v-3m5 3V7m5 9v-6"/>',
 upload:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6m-8 9v-6m-3 3 3-3 3 3"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8m-8 4h6"/>',
 mic:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-3 0h6"/>',
 chat:'<path d="M20 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/><path d="M7 9h9m-9 4h6"/>',
 pending:'<path d="M5 3h14v9M5 3v17h7m-4-12h8m-8 4h3"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M17.5 15v2.5l1.5 1"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',
 stethoscope:'<path d="M4 3v6a5 5 0 0 0 10 0V3m-10 0h2m6 0h2m-5 11v2a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="12" r="2"/>',
 sparkles:'<path d="m12 4 1.9 5.2L19 11l-5.1 1.9L12 18l-1.9-5.1L5 11l5.1-1.8zM19 2v4m-2-2h4M4 16v4m-2-2h4"/>',
 reset:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v.1"/>',

 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',
 down:'<path d="m7 10 5 5 5-5"/>',right:'<path d="m9 5 7 7-7 7"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
 check:'<path d="m4 12 5 5L20 6"/>',checkCircle:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v5m10-5v5M3 10h18"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 users:'<circle cx="9" cy="9" r="3"/><path d="M3 20a6 6 0 0 1 12 0m1-14a3 3 0 0 1 0 6m1 3a5 5 0 0 1 4 5"/>',
 shield:'<path d="m12 2 8 4v5c0 5-4.2 8.9-8 11-3.8-2.1-8-6-8-11V6z"/><path d="m8 11 3 3 5-5"/>',
 alert:'<path d="m10.3 4.4-8 14A1.8 1.8 0 0 0 4 21h16a1.8 1.8 0 0 0 1.6-2.6l-8-14a2 2 0 0 0-3.3 0z"/><path d="M12 9v5m0 3v.1"/>',
 book:'<path d="M12 5c-3-1.6-6.3-1.6-10-1v15c4-.8 7-.6 10 1 3-1.6 6-1.8 10-1V4c-3.7-.6-7-.6-10 1zm0 0v15"/>',
 activity:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',edit:'<path d="m15 4 5 5m-4-6a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L9 20l-6 1 1-6z"/>',
 plus:'<path d="M12 4v16M4 12h16"/>',send:'<path d="m3 10 18-7-7 18-3-8zM11 13l10-10"/>',
 play:'<path d="m8 4 12 8-12 8z"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
 building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-5h6v5M8 7h1m6 0h1m-8 4h1m6 0h1"/>',
 lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>'
};
function icon(name,size=20){const alias={'arrow-right':'arrow','chevron-down':'down','chevron-right':'right','file-text':'file','file-up':'upload','circle-check':'checkCircle','check-circle':'checkCircle','alert-triangle':'alert','clipboard-list':'records','bar-chart':'chart','message-circle':'chat','message-square':'chat','rotate-ccw':'reset','chart-column':'chart','layout-dashboard':'grid','calendar-days':'calendar','shield-check':'shield','sparkle':'sparkles','warning':'alert','close':'x','upload-cloud':'upload','arrowRight':'arrow','chevronRight':'right','chevronDown':'down','clipboard':'records','arrow-up-right':'arrow','list':'records','voice':'mic','document':'file'};const body=glyphs[name]||glyphs[alias[name]]||glyphs.file;return `<svg aria-hidden="true" width="${Number(size)||20}" height="${Number(size)||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`}
function brandMark(){return '<svg aria-hidden="true" viewBox="0 0 44 44" fill="none"><rect x="1" y="1" width="42" height="42" rx="12" fill="#91ddc9"/><path d="M23 8c-5.5 0-10 4.5-10 10v8c0 4 3.2 7 7 7h3c6 0 10-4.5 10-10v-4c0-6.4-3-11-10-11Z" stroke="#123c40" stroke-width="2.6"/><circle cx="24" cy="18" r="4" stroke="#123c40" stroke-width="2.3"/><path d="M10 22c1 9 9 9 15 3" stroke="#123c40" stroke-width="2.7" stroke-linecap="round"/></svg>'}
function avatar(p){return `<span class="avatar" style="background:${p.color};color:${p.ink}">${p.initials}</span>`}
function navItem(key,label,ico){const selected=route===key||(key==='pending'&&route==='review');return `<button class="nav-item${selected?' active':''}" ${selected?'aria-current="page"':''} onclick="go('${key}')">${icon(ico,18)}<span>${label}</span>${key==='pending'&&state.drafts.length?`<span class="nav-count">${state.drafts.length}</span>`:''}</button>`}
function renderShell(){
 const p=profile();
 const group=(title,arr)=>`<div class="nav-group"><span class="nav-label">${title}</span>${arr.map(it=>navItem(...it)).join('')}</div>`;
 document.getElementById('sidebar').innerHTML=`<button class="mobile-close" aria-label="Cerrar menú" onclick="closeNav()">${icon('x',18)}</button><button class="brand" onclick="go('home')" aria-label="DocNeo, ir al inicio">${brandMark()}<span><span class="brand-name">Doc<span>Neo</span></span><span class="brand-caption" style="display:block">Neonatología</span></span></button><nav class="nav-area" aria-label="Principal">${group('Servicio',[['home','Inicio','grid'],['records','Registros neonatales','records'],['stats','Estadísticas','chart']])}${group('Espacio de trabajo',[...(p.canWrite?[['document','Cargar documentación','upload'],['voice','Carga por voz','mic'],['pending','Revisiones pendientes','pending']]:[]),['chat','Consultas con Neo','chat']])}</nav><div class="nav-bottom"><div class="sandbox-note">${icon('layers',18)}<div><b>Entorno de demostración</b><small>Datos ficticios del servicio</small></div></div><button class="nav-item" onclick="guide()">${icon('help',16)}Guía de la demo</button>${p.canWrite?`<button class="nav-item" onclick="resetDialog()">${icon('reset',16)}Reiniciar demo</button>`:''}</div>`;
 document.getElementById('topbar').innerHTML=`<div class="crumb"><button class="mobile-nav" aria-label="Abrir menú" aria-controls="sidebar" onclick="openNav()">${icon('menu',21)}</button><span class="mobile-brand">Doc<span>Neo</span></span><span class="crumb-main">${icon('building',16)} Neonatología</span><span class="crumb-sep">/</span><span class="crumb-current">${esc(routeNames[route])}</span></div><div class="top-actions"><span class="demo-pill"><i class="status-dot"></i>Demo</span><button class="profile-btn" onclick="profileDialog()" aria-label="Cambiar perfil, ${p.name}">${avatar(p)}<span class="profile-mobile-label">Perfil</span><span class="profile-text"><strong>${p.name}</strong><small>${p.role}</small></span>${icon('down',15)}</button></div>`;
}
function render(){renderShell();const builders={home:dashboard,stats:statsView,records:recordsView,document:documentView,review:reviewView,pending:pendingView,chat:chatView,voice:voiceView};document.getElementById('main').innerHTML=builders[route]();document.title=`${routeNames[route]} · DocNeo`;if(route==='chat'){const last=document.querySelector('#main [data-chat-bottom]');if(last)last.scrollIntoView({block:'nearest'})}}
function go(next){if(!Object.hasOwn(routeNames,next))return;if(!profile().canWrite&&['pending','review','voice','document'].includes(next)){toast('Tu perfil tiene acceso de consulta. Podés elegir otro perfil desde el encabezado.');return}
 if(route==='voice'&&next!=='voice')stopVoice();if(route==='document'&&next!=='document'&&typeof intakeLeave==='function')intakeLeave();closeNav();closeDialog();route=next;render();window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true})}
function openNav(){const n=document.getElementById('sidebar');n.classList.add('is-open');document.getElementById('scrim').hidden=false;n.querySelector('.mobile-close').focus()}
function closeNav(){const n=document.getElementById('sidebar');n.classList.remove('is-open');document.getElementById('scrim').hidden=true}
function toast(msg){const el=document.getElementById('toast-region');el.innerHTML=`<div class="shell-toast">${icon('info',17)}${esc(msg)}</div>`;clearTimeout(shellToastTimer);shellToastTimer=setTimeout(()=>el.innerHTML='',4500)}
function closeDialog(){const el=document.getElementById('dialog');if(el.open)el.close()}
function dialog(title,eyebrow,body){closeNav();const el=document.getElementById('dialog');el.innerHTML=`<div class="dlg-wrap"><div class="dlg-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h2 id="dialog-title">${esc(title)}</h2></div><button class="round-btn" aria-label="Cerrar ventana" onclick="closeDialog()">${icon('x',18)}</button></div>${body}</div>`;if(!el.open)el.showModal()}

function dnIcon(key,size=20) {

function dnDateAdd(date,n) {
  const d=new Date(date+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function dnShortDate(date) {
  return Number(date.slice(8,10))+' '+dnMonthNames[Number(date.slice(5,7))-1];
}
function dnRange(key) {
  if (key==='oct') return {start:'2026-10-01',end:'2026-10-31'};
  if (key==='nov') return {start:'2026-11-01',end:CUT};
  if (key==='6w') return {start:dnDateAdd(CUT,-41),end:CUT};
  const dates=state.records.map(r=>r.admit).filter(Boolean);
  return {start:dates.length ? dates.concat(CUT).sort()[0] : CUT,end:CUT};
}
function dnMetrics({start,end}) {
  const within=d=>d && d>=start && d<=end;
  const ins=state.records.filter(r=>within(r.admit));
  const outs=state.records.filter(r=>within(r.discharge));
  const active=state.records.filter(r=>r.admit && r.admit<=end && (!r.discharge || r.discharge>end));
  const stays=outs.filter(r=>r.admit && r.discharge>=r.admit);
  const mean=stays.length ? stays.reduce((sum,r)=>sum+days(r.admit,r.discharge),0)/stays.length : null;
  return {ins,outs,active,mean,stays};
}

function dnBins(range) {
  const length=days(range.start,range.end)+1;
  const step=length<=7 ? 1 : length<=42 ? 7 : Math.ceil(length/6);
  const bins=[];
  for(let i=0;i<length;i+=step) {
    const start=dnDateAdd(range.start,i), end=dnDateAdd(range.start,Math.min(length-1,i+step-1));
    bins.push({start,end,ins:0,outs:0});
  }
  for(const r of state.records) {
    for (const b of bins) {
      if(r.admit>=b.start && r.admit<=b.end) b.ins++;
      if(r.discharge>=b.start && r.discharge<=b.end) b.outs++;
    }
  }
  return bins;
}
function dnChart(bins) {
  const plot={x:28,y:12,w:534,h:127};
  const max=Math.max(3,...bins.map(b=>Math.max(b.ins,b.outs)));
  const tickStep=Math.max(1,Math.ceil(max/3)), bound=tickStep*3;
  const ticks=[0,tickStep,2*tickStep,bound];
  const amt=plot.w/bins.length, bw=Math.min(23,amt*.28), gap=3;
  const lines=ticks.map(t=>{const y=plot.y+plot.h*(1-t/bound);return `<line x1="${plot.x}" x2="${plot.x+plot.w}" y1="${y}" y2="${y}" stroke="#dce7e6" ${t?'stroke-dasharray="3 4"':''}/><text x="${plot.x-9}" y="${y+3.5}" text-anchor="end" class="dn-axis">${t}</text>`}).join('');
  const groups=bins.map((b,i)=>{
    const cx=plot.x+(i+.5)*amt, baseline=plot.y+plot.h;
    const bars=[[b.ins,'#22998d',cx-bw-gap/2],[b.outs,'#aaa0d6',cx+gap/2]].map(([n,color,x])=>{
      if(!n) return '';
      const h=n/bound*plot.h, y=baseline-h, radius=Math.min(3,h/2);
      return `<path fill="${color}" d="M${x} ${baseline}V${y+radius}q0 ${-radius} ${radius} ${-radius}h${bw-2*radius}q${radius} 0 ${radius} ${radius}V${baseline}Z"/>`;
    }).join('');
    return `<g><title>${dnShortDate(b.start)} al ${dnShortDate(b.end)} · Ingresos ${b.ins} · Egresos ${b.outs}</title><rect x="${cx-amt/2+2}" y="${plot.y}" width="${amt-4}" height="${plot.h}" fill="transparent"/>${bars}<text x="${cx}" y="${baseline+21}" text-anchor="middle" class="dn-axis">${dnShortDate(b.start)}</text></g>`;
  }).join('');
  return '<svg class="dn-bar-chart" viewBox="0 0 573 168" role="img" aria-label="Gráfico de barras de ingresos y egresos por intervalo">'+lines+groups+'</svg>';
}
function dnActivityCard(key,showSelect) {
  const range=dnRange(key),bins=dnBins(range);
  return `<section class="dn-panel dn-activity"><div class="dn-chart-top"><div><div class="dn-overline">Actividad asistencial</div><h2>Ingresos y egresos</h2></div>${showSelect?dnPeriodSelect(key,'chart'):'<span class="dn-chart-span">'+dnShortDate(range.start)+' – '+dnShortDate(range.end)+'</span>'}</div><div class="dn-legend"><span><i style="background:#22998d"></i>Ingresos</span><span><i style="background:#aaa0d6"></i>Egresos</span></div>${dnChart(bins)}<details class="dn-chart-data"><summary>Ver valores por intervalo</summary><table><thead><tr><th>Intervalo</th><th>Ingresos</th><th>Egresos</th></tr></thead><tbody>${bins.map(b=>'<tr><td>'+dnShortDate(b.start)+' – '+dnShortDate(b.end)+'</td><td>'+b.ins+'</td><td>'+b.outs+'</td></tr>').join('')}</tbody></table></details></section>`;
}
function dnSectorCard(active,end) {
  const group=new Map();
  active.forEach(r=>{const key=r.sector || 'Sin informar'; group.set(key,(group.get(key)||0)+1)});
  let groups=Array.from(group).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'es'));
  if(groups.length>5) groups=groups.slice(0,4).concat([['Otros sectores',groups.slice(4).reduce((s,g)=>s+g[1],0)]]);
  let at=0;
  const segments=groups.map(([name,n],i)=>{
    const pct=100*n/active.length,offset=at;
    at+=pct;
    return `<circle cx="58" cy="58" r="46" fill="none" pathLength="100" stroke="${dnColors[i]}" stroke-width="12" stroke-dasharray="${Math.max(0.2,pct-(groups.length>1?1.9:0))} 100" stroke-dashoffset="${-offset}" transform="rotate(-90 58 58)"><title>${esc(name)} · ${n}</title></circle>`;
  }).join('');
  return `<section class="dn-panel dn-sector"><div class="dn-overline">Censo neonatal</div><h2>Ocupación por sector</h2><div class="dn-sector-content"><div class="dn-ring" aria-hidden="true"><svg viewBox="0 0 116 116"><circle cx="58" cy="58" r="46" fill="none" stroke="#edf2f2" stroke-width="12"/>${segments}</svg><div><b>${active.length}</b><span>${active.length===1?'paciente':'pacientes'}</span></div></div><div class="dn-sector-list">${groups.length?groups.map(([name,n],i)=>`<div><i style="background:${dnColors[i]}"></i><span>${esc(name)}</span><b>${n}</b></div>`).join(''):'<p>Sin internaciones activas.</p>'}</div></div><div class="dn-sector-note"><span class="dn-status-dot"></span> Censo al ${dnShortDate(end)} de 2026</div></section>`;
}

function intakeMakeDraft({title,kind,sourceText,rows,proof='',author}) {
  const cleanedRows = rows.map((r,originIndex)=>({...intakeRow(r),originIndex}));
  return {id:'b-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),
    title,kind,sourceText:sourceText||'',proof,author,created:CUT,rows:cleanedRows,

function createDraft(data) {
  if (!profile().canWrite || !data || !Array.isArray(data.rows) || !data.rows.length) return false;

  state.drafts.unshift(draft);
  state.activeDraft=draft.id;
  intakeRowIndex=0; intakeConfirming=false; intakeMessage=''; intakeProofVisible=false;
  persist(); go('review');

function intakeDupe(row,d) {

  if (d.rows.some(r=>r!==row && r.decision!=='rejected' && String(r.id||'').trim().toUpperCase()===id)) return 'Este identificador se repite dentro del borrador. Corregí el dato u omití la fila repetida.';
  return '';
}
function intakeValidDate(str){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str||'')) return false;

}
function intakeProblems(row,d){
  let errs={};
  for(const key of intakeRequired) if (!String(row[key]??'').trim()) errs[key]='Completá este dato.';
  if(row.id && !/^RN-\d{4}-\d{3,6}$/i.test(row.id)) errs.id='Usá el formato RN-2026-049.';
  const dup=intakeDupe(row,d);
  if (dup) errs.id=dup;
  for (const key of ['birth','admit','discharge']){
    if (row[key] && (!intakeValidDate(row[key])||row[key]>CUT)) errs[key]='Ingresá una fecha válida hasta el 9 nov 2026.';
  }
  if (row.admit && row.birth && row.birth>row.admit) errs.admit='El ingreso debe ser igual o posterior al nacimiento.';
  if (row.discharge && row.admit && row.admit>row.discharge) errs.discharge='El egreso debe ser igual o posterior al ingreso.';
  if (row.weight!=='' && (!Number.isInteger(Number(row.weight))||Number(row.weight)<=0)) errs.weight='Ingresá un número entero positivo en gramos.';
  if (row.gest && !/^\d{1,2}\+[0-6]$/.test(row.gest)) errs.gest='Escribí semanas + días, por ejemplo 38+2.';
  if (row.sector&&!SECTORS.includes(row.sector)) errs.sector='Seleccioná un sector de la lista.';
  for(const [key,issue] of Object.entries(row.issues||{})){
    if (issue && !row.checked[key]) errs[key]=errs[key]||'Corroborá el dato con la fuente.';
  }
  return errs;
}
function intakeField(row,key,label,type,errors){

  let input='';

    const opts=key==='sex'?[['','Sin informar'],['F','Femenino'],['M','Masculino']]:key==='vax'?[['','Sin informar'],['Informado','Informado']]:[['','Elegir sector'],...SECTORS.map(v=>[v,v])];
    input='<select '+attrs+'>'+opts.map(([v,l])=>'<option value="'+esc(v)+'" '+((key==='vax'&&val==='Sin informar'?'':val)===v?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  } else {
    input='<input '+attrs+'type="'+type+'" '+(type==='date'?'max="'+CUT+'" ':'')+(key==='weight'?'min="1" step="1" inputmode="numeric" ':'')+(key==='gest'?'placeholder="38+2" ':'')+'value="'+esc(String(val))+'">';
  }

  return '<div class="in-field '+(flagged?'flagged':'')+' '+(key==='sector'?'span2':'')+'" data-key="'+key+'"><label for="in-f-'+key+'">'+label+(required?' <span aria-hidden="true">·</span>':'')+'</label>'+input+
    '<small class="in-field-note">'+(checked&&issue?'<span class="in-ok">✓ Corroborado</span>':issue?esc(issue):flagged?esc(problem):'')+'</small>'+
    (verify&&row.decision==='pending'?'<button class="in-link" type="button" onclick="intakeCheck(\''+key+'\')">'+(val?'Marcar como corroborado':'Dejar sin informar')+'</button>':'')+'</div>';

function intakeCheck(key) {

function intakeEdit(key,value){

function intakeDecide(decision) {
  const d=intakeActive(),r=d?.rows[intakeRowIndex];
  if (!profile().canWrite || !r || !['approved','rejected','pending'].includes(decision)) return;

    '<div class="in-actions"><button class="btn secondary" onclick="intakeConfirming=false;render()">Volver a revisar</button><button class="btn primary" onclick="intakeCommit()">'+icon('check',16)+' '+(a.length?'Confirmar incorporación':'Confirmar omisión')+'</button></div></section>';

function intakeCommit(){
  const d=intakeActive();
  if(!profile().canWrite || !intakeConfirming || !d)return;
  const approved=d.rows.filter(r=>r.decision==='approved'),omitted=d.rows.filter(r=>r.decision==='rejected');
  if(!approved.length && !omitted.length)return;
  for(const r of approved){
    const errors=intakeProblems(r,d),key=Object.keys(errors)[0];
    if(key){r.decision='pending';intakeRowIndex=d.rows.indexOf(r);intakeConfirming=false;intakeMessage=errors[key];persist();render();return;}
  }
  approved.forEach(r=>{
    const record={};
    intakeFieldList.forEach(([key])=>{record[key]=key==='weight'?Number(r.weight):String(r[key]??'').trim();});
    record.id=record.id.toUpperCase();record.vax=record.vax||'Sin informar';
    const original=(d.original||[])[r.originIndex]||(d.original||[]).find(row=>row.id===r.id);
    let sourceText=d.sourceText||'';
    if(d.kind!=='Voz' && original){
      const sourceValues=intakeFieldList.map(([key,label])=>label+' · '+(original[key]!==''&&original[key]!=null?original[key]:original.issues?.[key]||'Sin informar'));
      sourceText+='\n\n'+sourceValues.join('\n');
      if(d.proof) sourceText+='\n\nFicha de respaldo. '+d.proof;
    }
    Object.assign(record,{source:d.title,sourceTitle:d.title,sourceKind:d.kind,sourceText,author:d.author,reviewer:profile().name,updated:CUT});
    state.records.push(record);
  });
  d.rows=d.rows.filter(r=>r.decision==='pending');
  if(!d.rows.length) state.drafts=state.drafts.filter(x=>x.id!==d.id);
  state.activeDraft=null;intakeRowIndex=0;intakeConfirming=false;intakeMessage='';intakeProofVisible=false;
  persist();go(approved.length?'records':'pending');
  toast(approved.length?intakePlural(approved.length,'registro incorporado.','registros incorporados.'):'Revisión finalizada. Se omitieron las filas seleccionadas.');
}

function cvAnswer(question) {

function cvDemoVoice() {

function cvBeginMic(){

  stopVoice()

  }catch(e){stopVoice();cvVoiceNote='El micrófono no está disponible. Podés usar el ejemplo o escribir el texto.';render()}
}
const cvNumberWords = {cero:0,un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900}
function cvNormalizeSpokenNumbers(s) {
  const keys=[...Object.keys(cvNumberWords),'mil'].sort((a,b)=>b.length-a.length).join('|')
  return s.replace(new RegExp('\\b(?:'+keys+')(?:\\s+(?:y\\s+)?(?:'+keys+'))*\\b','g'),phrase=>{
    let high=0,total=0;for(const w of phrase.split(/\s+/)){if(w==='y')continue;if(w==='mil'){high+=(total||1)*1000;total=0}else total+=cvNumberWords[w]}return String(high+total)
  })
}
function cvParseDate(q,label) {
  const wordMonths=cvMonths.join('|'),date='(hoy|\\d{4}-\\d{2}-\\d{2}|\\d{1,2}[/.\\-]\\d{1,2}[/.\\-]\\d{4}|\\d{1,2}\\s+de\\s+(?:'+wordMonths+')\\s+(?:de(?:l)?\\s+)?\\d{4})'
  const m=q.match(new RegExp('\\b(?:'+label+')\\s*(?:[:;,]\\s*)?(?:(?:fue|es|el|en|del|al|dia)\\s+){0,3}'+date+'\\b'))
  if(!m)return '';const raw=m[1];if(raw==='hoy')return CUT
  let y,mo,d;if(/^\d{4}-/.test(raw)){[y,mo,d]=raw.split('-').map(Number)}else if(/^\d{1,2}[/.\-]/.test(raw)){[d,mo,y]=raw.split(/[/.\-]/).map(Number)}else{const v=raw.match(/^(\d+) de (\w+) (?:de(?:l)? )?(\d+)$/);if(!v)return '';d=Number(v[1]);mo=cvMonths.indexOf(v[2])+1;y=Number(v[3])}
  const test=new Date(Date.UTC(y,mo-1,d));return test.getUTCFullYear()===y&&test.getUTCMonth()+1===mo&&test.getUTCDate()===d?String(y)+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):''
}
function cvExtractVoice(text) {
  const q=cvNormalizeSpokenNumbers(cvText(text)),id=q.match(/\brn[\s-]*(\d{4})[\s-]+(\d{1,4})\b/)
  const birth=cvParseDate(q,'nacio|nacida|nacido|nacimiento'),admit=cvParseDate(q,'ingreso|ingresada|ingresado|admision'),discharge=cvParseDate(q,'egreso|alta')
  const w=q.match(/\b(?:peso(?:\s+al\s+nacer|\s+de nacimiento)?\s*[,.:]?\s*(?:(?:de|es|fue|unos)\s+){0,2})(\d{1,5}(?:[.,]\d{1,3})?)\s*(kilogramos?|kilos?|kg|gramos?|gr?s?)\b/)
  let weight=''
  if(w){const kg=/^k/.test(w[2]);const raw=kg?w[1].replace(',','.'):w[1].replace(/[.,](?=\d{3}$)/,'').replace(',','.');const grams=Math.round(Number(raw)*(kg?1000:1));if(grams>0&&Number.isFinite(grams))weight=grams}
  const g=q.match(/\b(\d{2})\s*(?:semanas?\s*(?:(?:y|con|mas)\s*)?(\d)\s*dias?|\+\s*(\d)\b)/)
  const gest=g&&Number(g[2]||g[3])<7?g[1]+'+'+(g[2]||g[3]):''
  const female=/\b(?:sexo\s*[:,]?\s*(?:f\b|femenino)|femenin[oa]|nina)\b/.test(q),male=/\b(?:sexo\s*[:,]?\s*(?:m\b|masculino)|masculin[oa]|nino)\b/.test(q)
  const sectors=[[/\b(?:terapia intensiva|cuidados intensivos|ucin)\b/,SECTORS[2]],[/\bcuidados intermedios\b/,SECTORS[1]],[/\binternacion conjunta\b/,SECTORS[0]]].filter(([re])=>re.test(q))
  const sector=sectors.length===1?sectors[0][1]:''
  const vax=/\bvacunacion\s*(?:[:,]\s*)?(?:informada|registrada)\b/.test(q)?'Informado':/\bvacunacion\s*(?:[:,]\s*)?(?:sin informar|no informada)\b/.test(q)?'Sin informar':''
  const r={id:id?'RN-'+id[1]+'-'+id[2].padStart(3,'0'):nextId(),birth,admit,discharge,weight,gest,sex:female===male?'':female?'F':'M',sector,vax,issues:{}}
  for(const k of ['birth','admit','weight','sector'])if(!r[k])r.issues[k]='Falta corroborar en el dictado'
  return r
}
function cvPrepareVoice() {
  if(!profile().canWrite||!cvTranscript.trim()||['mic','sample','starting'].includes(cvVoiceMode))return
  const t=cvTranscript.trim(),r=cvExtractVoice(t)
  if(!r.birth&&!r.admit&&!r.weight&&!r.gest&&!r.sex&&!r.sector&&!r.vax&&!/\brn[\s-]*\d{4}[\s-]+\d{1,4}\b/i.test(t)){cvVoiceNote='No reconocí campos del ingreso. Indicá al menos un dato, por ejemplo “Peso al nacer, 3120 gramos”.';render();return}
  createDraft({title:'Dictado de ingreso neonatal',kind:'Voz',sourceText:t,rows:[r]});cvTranscript='';cvVoiceNote=''
}
function resetChatVoice(){stopVoice();cvChatLog.clear();cvVoiceUser='';cvTranscript='';cvVoiceNote=''}


const tableQuery={text:'',status:'all',sector:'all'};
function matchesRecords(){return state.records.filter(r=>r.id.toLowerCase().includes(tableQuery.text.trim().toLowerCase())&&(tableQuery.status==='all'||(r.discharge?'out':'in')===tableQuery.status)&&(tableQuery.sector==='all'||tableQuery.sector===r.sector)).slice().sort((a,b)=>b.admit.localeCompare(a.admit)||b.id.localeCompare(a.id))}
function recordStatus(r){return r.discharge?'<span class="badge shell-badge-out">Egresado</span>':'<span class="badge shell-badge-in">Internado</span>'}
function recButton(id){return `openRecord(${esc(JSON.stringify(id))})`}
function recordsResults(){const rows=matchesRecords();return `<div class="rec-meta" aria-live="polite">${rows.length} de ${state.records.length} registros confirmados</div>${rows.length?`<div class="table-scroll"><table class="rec-table"><thead><tr><th>Registro neonatal</th><th>Ingreso</th><th>Sector</th><th>Estado</th><th>Origen</th><th><span class="invisible-text">Detalle</span></th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="record-link" onclick="${recButton(r.id)}">${esc(r.id)}</button></td><td>${esc(fmt(r.admit))}</td><td>${esc(r.sector||'Sin informar')}</td><td>${recordStatus(r)}</td><td>${esc(r.sourceKind||'Documento')}</td><td><button class="round-btn" aria-label="Ver ${esc(r.id)}" onclick="${recButton(r.id)}">${icon('right',13)}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="shell-empty">${icon('search',23)}<b>Sin coincidencias</b>Probá otro identificador o cambiá los filtros.</div>`}`}
function recordsFilter(key,val){if(!Object.hasOwn(tableQuery,key))return;tableQuery[key]=val;document.getElementById('rec-results').innerHTML=recordsResults()}
function recordsView(){const opts=(arr,val)=>arr.map(([v,t])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('');return `<header class="shell-heading"><div><div class="eyebrow">Archivo del servicio</div><h1>Registros neonatales</h1><p>Consultá los ingresos confirmados, sus datos de origen y el profesional que los validó.</p></div>${profile().canWrite?`<button class="btn primary" onclick="go('document')">${icon('upload',17)} Cargar documentación</button>`:''}</header><section class="panel"><div class="shell-filter"><label class="shell-field searchbox">Buscar registro<span class="searchwrap">${icon('search',17)}<input placeholder="Ej. RN-2026-048" type="search" id="rec-search" value="${esc(tableQuery.text)}" oninput="recordsFilter('text',this.value)"></span></label><label class="shell-field">Estado<select onchange="recordsFilter('status',this.value)">${opts([['all','Todos los estados'],['in','Internados'],['out','Egresados']],tableQuery.status)}</select></label><label class="shell-field">Sector<select onchange="recordsFilter('sector',this.value)">${opts([['all','Todos los sectores'],...SECTORS.map(s=>[s,s])],tableQuery.sector)}</select></label></div><div id="rec-results">${recordsResults()}</div></section>`}
function openRecord(id){
 const r=state.records.find(x=>x.id===id);if(!r)return;
 const values=[['Fecha de nacimiento',fmt(r.birth)],['Sexo',({F:'Femenino',M:'Masculino'})[r.sex]||'Sin informar'],['Fecha de ingreso',fmt(r.admit)],['Fecha de egreso',r.discharge?fmt(r.discharge):'Continúa internado'],['Peso al nacer',r.weight?Number(r.weight).toLocaleString('es-AR')+' g':'Sin informar'],['Edad gestacional',r.gest?String(r.gest).replace('+',' sem. + ')+' días':'Sin informar'],['Sector',r.sector||'Sin informar'],['Registro de vacunación',r.vax||'Sin informar']];
 const history=(r.history||[]).slice().reverse();
 dialog(id,'Registro neonatal confirmado',`${recordStatus(r)}<dl class="dlg-values">${values.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><section class="trace-card"><h3>Origen y validación</h3><p><b>Fuente</b> · ${esc(r.sourceTitle||r.source||'Documento de muestra')}</p><p><b>Cargado por</b> · ${esc(r.author||'Equipo del servicio')}</p><p><b>Confirmado por</b> · ${esc(r.reviewer||'Equipo del servicio')}</p>${r.sourceText?`<details class="record-source"><summary>Ver ${r.sourceKind==='Voz'?'transcripción':'referencia de origen'}</summary><p>${esc(r.sourceText)}</p></details>`:''}</section>${history.length?`<section class="trace-card"><h3>Historial de cambios</h3><ul>${history.map(h=>`<li>${esc(fmt(h.date))} · ${esc(h.by)} · ${esc(h.change)}</li>`).join('')}</ul></section>`:''}<div class="dlg-actions">${profile().canWrite?`<button class="btn secondary" onclick="editRecord(${esc(JSON.stringify(id))})">${icon('edit',16)} Editar registro</button>`:''}<button class="btn primary" onclick="closeDialog()">Cerrar</button></div>`)
}
function editRecord(id){
 const r=state.records.find(x=>x.id===id);if(!r||!profile().canWrite)return;
 dialog('Editar registro',r.id,`<p class="dialog-desc">Confirmá los cambios para actualizar el registro y los indicadores del servicio.</p><form onsubmit="saveRecordEdit(event,${esc(JSON.stringify(id))})"><div class="edit-grid"><label class="shell-field">Sector<select name="sector">${SECTORS.map(s=>`<option ${s===r.sector?'selected':''}>${s}</option>`).join('')}</select></label><label class="shell-field">Egreso (opcional)<input name="discharge" type="date" min="${esc(r.admit)}" max="${CUT}" value="${esc(r.discharge)}"></label><label class="shell-field">Peso al nacer (g)<input name="weight" type="number" required min="1" step="1" value="${esc(r.weight)}"></label><label class="shell-field">Registro de vacunación<select name="vax">${['Informado','Sin informar'].map(v=>`<option ${r.vax===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="inline-error" id="record-error" aria-live="polite"></div><div class="dlg-actions"><button type="button" class="btn secondary" onclick="${recButton(r.id)}">Volver</button><button type="submit" class="btn primary">Confirmar cambios</button></div></form>`)
}
function saveRecordEdit(e,id){
 e.preventDefault();const r=state.records.find(x=>x.id===id);if(!r||!profile().canWrite)return;const f=new FormData(e.target);const data={sector:f.get('sector'),weight:Number(f.get('weight')),vax:f.get('vax'),discharge:f.get('discharge')};
 if(!SECTORS.includes(data.sector)||!Number.isInteger(data.weight)||data.weight<=0||(data.discharge&&(data.discharge<r.admit||data.discharge>CUT))){document.getElementById('record-error').textContent='Corroborá el peso, el sector y la fecha de egreso.';return}
 const labels={sector:'Sector',weight:'Peso (g)',vax:'Vacunación',discharge:'Egreso'};
 const changes=Object.keys(data).filter(k=>String(r[k]??'')!==String(data[k])).map(k=>`${labels[k]}: ${k==='discharge'?(r[k]?fmt(r[k]):'Sin egreso'):(r[k]||'Sin informar')} → ${k==='discharge'?(data[k]?fmt(data[k]):'Sin egreso'):(data[k]||'Sin informar')}`);
 if(!changes.length){openRecord(id);toast('El registro conserva sus datos.');return}
 Object.assign(r,data,{updated:CUT});r.history??=[];r.history.push({by:profile().name,date:CUT,change:changes.join(' · ')});persist();render();openRecord(id);toast('Cambios confirmados')
}

state=loadState();
render();
if(!storageOK)toast("Los cambios se conservan mientras esta pestaña esté abierta.");

</script>
